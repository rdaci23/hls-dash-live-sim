name: Browser caption qualification
run-name: Browser caption qualification / ${{ github.ref_name }}
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: browser-caption-${{ github.ref }}
  cancel-in-progress: true
jobs:
  captions:
    name: Captions and audio startup / ${{ matrix.protocol }} / Chrome
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        protocol: [hls, dash]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chrome
      - run: google-chrome --version
      - run: npm run browser:audio-probe -- --protocol ${{ matrix.protocol }} --repeat 3 --output output/ci-audio-probe
      - run: npm run browser:tracks -- --protocol ${{ matrix.protocol }} --output output/ci-tracks
      - run: npm run browser:caption-controls -- --protocol ${{ matrix.protocol }} --output output/ci-caption-controls
      - run: npm run browser:scenarios -- --protocol ${{ matrix.protocol }} --kind late-captions --output output/ci-late-captions
      - run: npm run browser:scenarios -- --protocol ${{ matrix.protocol }} --kind text-outage --output output/ci-text-outage
      - run: npm run browser:scenarios -- --protocol ${{ matrix.protocol }} --kind malformed-manifest --output output/ci-malformed-manifest
      - name: Retain complete startup, control and caption evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: captions-${{ matrix.protocol }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/ci-audio-probe/
            output/ci-tracks/
            output/ci-caption-controls/
            output/ci-late-captions/
            output/ci-text-outage/
            output/ci-malformed-manifest/
          if-no-files-found: error
          retention-days: 7
