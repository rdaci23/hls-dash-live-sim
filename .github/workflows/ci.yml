name: CI
run-name: CI / ${{ github.event_name == 'workflow_dispatch' && (inputs.memory_profile && 'memory-profile' || inputs.scope) || 'routine' }} / ${{ github.ref_name }}

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        description: Manual verification scope; endurance does not qualify the full candidate
        type: choice
        options: [full, endurance]
        default: full

      playback:
        description: Run the full six-case browser playback gate
        type: boolean
        default: false

      release_soak:
        description: Run the actual four-hour concurrent release-candidate soak
        type: boolean
        default: false

      memory_profile:
        description: Diagnostic driver allocation profile; never qualifies a release (use endurance scope)
        type: boolean
        default: false

      core_observations:
        description: Capture core rendition and network browser compatibility observations
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && 'manual' || 'routine' }}
  cancel-in-progress: true

jobs:
  routine:
    name: Routine / Linux / Node 24
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run docs:check
      - run: npm run typecheck
      - run: npm test

  checks:
    name: Checks / ${{ matrix.os }} / Node ${{ matrix.node }}
    if: github.event_name == 'workflow_dispatch' && inputs.scope != 'endurance'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run docs:check
      - run: npm run notices:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run roku:build
      - run: npm run scenario:verify -- --protocol hls
      - run: npm run test:package

  control-ui:
    name: Chrome control UI
    if: github.event_name == 'workflow_dispatch' && inputs.scope != 'endurance'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chrome
      - run: npm run test:ui

  dash-engine:
    name: DASH engine integration
    if: github.event_name == 'workflow_dispatch' && inputs.scope != 'endurance'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Pull the pinned AMD64 engine
        run: |
          IMAGE=$(node -p 'require("./dist/support-tools/dash-sim-runner.js").DEFAULT_IMAGE')
          docker pull --platform linux/amd64 "$IMAGE"
      - run: npm run test:docker
      - run: npm run scenario:verify
      - run: npm run retry:verify -- --output output/ci-multi-retry
      - name: Retain multi-attempt retry evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: multi-retry-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/ci-multi-retry/
          if-no-files-found: warn
          retention-days: 7
      - run: npm run audio:verify -- --output output/ci-audio-outage
      - name: Retain DASH audio-only outage evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: audio-outage-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/ci-audio-outage/
          if-no-files-found: warn
          retention-days: 7
      - run: npm run faults:verify -- --output output/ci-core-faults
      - name: Retain payload and transport wire evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-faults-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/ci-core-faults/
          if-no-files-found: error
          retention-days: 7
      - run: npm run manifest:preview -- --output output/ci-manifest-preview
      - name: Retain inert manifest inspection evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manifest-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/ci-manifest-preview/
          if-no-files-found: error
          retention-days: 7
      - run: npm run controls:verify -- --output output/ci-scenario-controls
      - name: Retain scenario control evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scenario-controls-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/ci-scenario-controls/
          if-no-files-found: error
          retention-days: 7
      - run: npm run rendition:verify -- --output output/ci-rendition-outages
      - name: Retain rendition outage evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rendition-outages-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/ci-rendition-outages/
          if-no-files-found: warn
          retention-days: 7
      - run: npm run network:presets -- --output output/ci-network-presets
      - name: Retain realistic network preset evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: network-presets-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/ci-network-presets/
          if-no-files-found: warn
          retention-days: 7
      - run: npm run resource:verify -- --output output/ci-resource-targets
      - name: Retain manifest and initialization targeting evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: resource-targets-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/ci-resource-targets/
          if-no-files-found: warn
          retention-days: 7
      - run: npm run transport:verify -- --output output/ci-transport-faults
      - name: Retain bounded transport fault evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: transport-faults-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/ci-transport-faults/
          if-no-files-found: warn
          retention-days: 7
      - run: npm run network:verify -- --output output/ci-network-scenarios
      - name: Retain network timeline and replay evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: network-scenarios-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/ci-network-scenarios/
          if-no-files-found: warn
          retention-days: 7
      - run: npm run manifest:verify -- --output output/ci-manifest-freeze
      - name: Retain simulator manifest freeze evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manifest-freeze-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/ci-manifest-freeze/
          if-no-files-found: warn
          retention-days: 7

  http-policy:
    name: HTTP policy and safe response headers
    if: github.event_name == 'workflow_dispatch' && inputs.scope != 'endurance'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Pull the pinned AMD64 engine
        run: |
          IMAGE=$(node -p 'require("./dist/support-tools/dash-sim-runner.js").DEFAULT_IMAGE')
          docker pull --platform linux/amd64 "$IMAGE"
      - run: npm run http:verify -- --output output/ci-http-policy
      - run: npm run headers:verify -- --output output/ci-status-headers
      - run: npm run cache:verify -- --output output/ci-cache-scenarios
      - run: npm run publication:verify -- --output output/ci-publication-scenarios
      - name: Retain HTTP evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: http-policy-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/ci-http-policy/
            output/ci-status-headers/
            output/ci-cache-scenarios/
            output/ci-publication-scenarios/
          if-no-files-found: error
          retention-days: 7

  endurance-smoke:
    name: Ten-minute concurrent HLS and DASH smoke
    if: github.event_name == 'workflow_dispatch' && !inputs.memory_profile
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chrome
      - run: npm run browser:routing -- --output output/ci-browser-routing
      - run: npm run endurance:cleanup -- --output output/ci-endurance-cleanup
      - run: npm run endurance:smoke -- --output output/ci-endurance
      - name: Retain complete endurance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: endurance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/ci-endurance/
            output/ci-endurance-cleanup/
            output/ci-browser-routing/
          if-no-files-found: error
          retention-days: 7

  local-services:
    name: Offline keys, access renewal and UTC
    if: github.event_name == 'workflow_dispatch' && inputs.scope != 'endurance'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chrome
      - run: npm run services:verify -- --output output/ci-local-services
      - run: npm run browser:services -- --output output/ci-service-browser
      - name: Retain service evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: local-services-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/ci-local-services/
            output/ci-service-browser/
          if-no-files-found: error
          retention-days: 7

  owned-lifecycle:
    name: Owned lifecycle and DVR
    if: github.event_name == 'workflow_dispatch' && inputs.scope != 'endurance'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chrome
      - run: npm run lifecycle:invalid -- --output output/ci-invalid-lifecycle
      - run: npm run dvr:verify -- --output output/ci-dvr-http
      - run: npm run browser:dvr -- --output output/ci-dvr-browser
        if: github.event_name == 'workflow_dispatch' && inputs.playback
      - run: npm run lifecycle:verify -- --output output/ci-lifecycle-http
      - run: npm run browser:lifecycle -- --output output/ci-lifecycle-browser
      - name: Retain lifecycle evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lifecycle-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/ci-invalid-lifecycle/
            output/ci-dvr-http/
            output/ci-dvr-browser/
            output/ci-lifecycle-http/
            output/ci-lifecycle-browser/
          if-no-files-found: error
          retention-days: 7

  independent-tracks:
    name: Owned independent audio and captions
    if: github.event_name == 'workflow_dispatch' && inputs.scope != 'endurance'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chrome
      - run: npm run tracks:verify -- --output output/ci-independent-tracks
      - run: npm run browser:tracks -- --output output/ci-decoded-tracks
      - name: Retain decoded-track and HTTP evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: independent-tracks-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/ci-independent-tracks/
            output/ci-decoded-tracks/
          if-no-files-found: error
          retention-days: 7

  hls-abr:
    name: HLS automatic ABR recovery
    if: github.event_name == 'workflow_dispatch' && inputs.scope != 'endurance'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chrome
      - run: npm run browser:abr -- --output output/ci-hls-abr
      - name: Retain ABR evidence in this repository
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hls-abr-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/ci-hls-abr/
          if-no-files-found: warn
          retention-days: 7

  sustained-outage:
    name: Sustained HLS and DASH outage recovery
    if: github.event_name == 'workflow_dispatch' && inputs.scope != 'endurance'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx --no-install playwright install --with-deps chrome
      - name: Pull the pinned AMD64 engine
        run: |
          IMAGE=$(node -p 'require("./dist/support-tools/dash-sim-runner.js").DEFAULT_IMAGE')
          docker pull --platform linux/amd64 "$IMAGE"
      - run: npm run browser:outage -- --output output/ci-outage
      - name: Retain outage evidence in this repository
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sustained-outage-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/ci-outage/
          if-no-files-found: warn
          retention-days: 7

  dash-abr:
    name: DASH automatic ABR switching
    if: github.event_name == 'workflow_dispatch' && inputs.scope != 'endurance'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx --no-install playwright install --with-deps chrome
      - name: Pull the pinned AMD64 engine
        run: |
          IMAGE=$(node -p 'require("./dist/support-tools/dash-sim-runner.js").DEFAULT_IMAGE')
          docker pull --platform linux/amd64 "$IMAGE"
      - run: npm run browser:dash-abr -- --output output/ci-dash-abr
      - name: Retain DASH adaptation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dash-abr-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/ci-dash-abr/
          if-no-files-found: warn
          retention-days: 7

  browser-playback:
    name: Full browser playback gate
    if: github.event_name == 'workflow_dispatch' && inputs.playback && inputs.scope != 'endurance'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx --no-install playwright install --with-deps chrome
      - name: Pull the pinned AMD64 engine
        run: |
          IMAGE=$(node -p 'require("./dist/support-tools/dash-sim-runner.js").DEFAULT_IMAGE')
          docker pull --platform linux/amd64 "$IMAGE"
      - run: npm run browser:verify -- --output output/ci-playback
      - name: Retain playback evidence in this repository
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-playback-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/ci-playback/
          if-no-files-found: warn
          retention-days: 7

  core-browser-observations:
    name: Core browser observation / ${{ matrix.case }}
    if: github.event_name == 'workflow_dispatch' && inputs.core_observations && inputs.scope != 'endurance'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        case: [hls-high, hls-low, dash-low, hls-starvation, dash-starvation, hls-oscillation, dash-oscillation]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx --no-install playwright install --with-deps chrome
      - name: Pull the pinned AMD64 engine
        if: startsWith(matrix.case, 'dash-')
        run: |
          IMAGE=$(node -p 'require("./dist/support-tools/dash-sim-runner.js").DEFAULT_IMAGE')
          docker pull --platform linux/amd64 "$IMAGE"
      - run: npm run browser:core -- --case ${{ matrix.case }} --output output/ci-core-browser
      - name: Retain browser compatibility observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-browser-${{ matrix.case }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/ci-core-browser/
          if-no-files-found: error
          retention-days: 7

  scenario-browser-observations:
    name: Owned browser fault observation / ${{ matrix.kind }}
    if: github.event_name == 'workflow_dispatch' && inputs.core_observations && inputs.scope != 'endurance'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        kind: [malformed-manifest, damaged-media, wrong-track-init, framing, manifest-rollback, rendition-lag, audio-outage, text-outage, late-captions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chrome
      - run: npm run browser:scenarios -- --kind ${{ matrix.kind }} --output output/ci-scenario-browser
      - name: Retain fault observations and HTTP restoration separately
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scenario-browser-${{ matrix.kind }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/ci-scenario-browser/
          if-no-files-found: error
          retention-days: 7

  release-soak:
    name: Four-hour concurrent release-candidate soak
    if: github.event_name == 'workflow_dispatch' && (inputs.release_soak || inputs.memory_profile)
    runs-on: ubuntu-24.04
    timeout-minutes: 285
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chrome
      - run: npm run endurance:release -- --output output/ci-release-soak ${{ inputs.memory_profile && '--profile-memory' || '' }}
      - name: Retain the complete release soak
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-soak-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/ci-release-soak/
          if-no-files-found: error
          retention-days: 7
