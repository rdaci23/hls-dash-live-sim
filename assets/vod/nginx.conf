# Minimal reviewed configuration for the pinned nginx-vod-module image.
# Mounted read-only by MP4 VoD mode; media comes from the read-only /vod mount.
worker_processes 1;
events { worker_connections 256; }
http {
    include mime.types;
    default_type application/octet-stream;
    access_log off;
    server {
        listen 80;
        location /vod/ {
            vod hls;
            vod_mode local;
            vod_segment_duration 2000;
            vod_align_segments_to_key_frames on;
            alias /vod/;
            add_header Access-Control-Allow-Origin "*" always;
            add_header Cache-Control "no-store" always;
        }
        location / { return 404; }
    }
}
